# Ledger — static PWA + API reverse proxy
# Keep the original scheme when a TLS proxy (Caddy) sits in front.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 6m;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/csv application/json application/javascript application/manifest+json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 30s;
  }

  # Fingerprinted build assets: cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Service worker and app shell must always revalidate so updates ship immediately.
  location ~* ^/(sw\.js|workbox-.*\.js|index\.html|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
