# Production stack for a small VPS (e.g. Oracle Cloud free tier, 1 GB RAM).
#   DOMAIN=ledger.example.com docker compose -f docker-compose.prod.yml up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN, e.g. DOMAIN=ledger.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    image: ledger-web:latest
    restart: unless-stopped
    depends_on: [api]
    mem_limit: 64m
    logging: *logging

  api:
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    image: ledger-api:latest
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/ledger.db
      COOKIE_SECURE: "true"
      TRUST_PROXY: "2"
      SESSION_DAYS: ${SESSION_DAYS:-30}
      NODE_OPTIONS: --max-old-space-size=192
    volumes:
      - ledger-data:/data
    mem_limit: 320m
    logging: *logging

volumes:
  ledger-data:
  caddy-data:
  caddy-config:
