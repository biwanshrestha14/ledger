# Production stack for a server that ALREADY runs a web server (Nginx/Caddy/Apache) on 80/443.
# Ledger listens only on 127.0.0.1:8081; the host web server terminates HTTPS and forwards to it.
#   docker compose -f docker-compose.hostproxy.yml up -d --build
services:
  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    image: ledger-web:latest
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:${LEDGER_PORT:-8081}:80"
    mem_limit: 64m
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    image: ledger-api:latest
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/ledger.db
      COOKIE_SECURE: "true"
      TRUST_PROXY: "2" # host web server + container nginx
      SESSION_DAYS: ${SESSION_DAYS:-30}
      NODE_OPTIONS: --max-old-space-size=192
    volumes:
      - ledger-data:/data
    mem_limit: 320m
    logging: *logging

volumes:
  ledger-data:
